name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tracking
          POSTGRES_PASSWORD: tracking
          POSTGRES_DB: tracking_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tracking:tracking@127.0.0.1:5432/tracking_ci
      TEST_DATABASE_URL: postgresql+psycopg://tracking:tracking@127.0.0.1:5432/tracking_ci_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: migrations up, no drift, down, up
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: offline validator (YAML and JSON parse, templates, policies, realm, nftables render)
        run: uv run --with pyyaml --with jinja2 python infra/tests/validate.py
      - name: ansible syntax check
        working-directory: infra/ansible
        run: |
          uvx --from ansible-core==2.21.6 ansible-galaxy collection install -r requirements.yml
          for pb in site workspaces gateway portal backup; do
            uvx --from ansible-core==2.21.6 ansible-playbook -i inventory.example.yml --syntax-check playbooks/$pb.yml
          done
      - name: compose config (lab stack, example env)
        working-directory: infra/compose
        run: docker compose --env-file ../versions.env --env-file .env.example -f docker-compose.lab.yml config -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tracking-portal:ci .
