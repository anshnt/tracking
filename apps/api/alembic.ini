[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s
# URL comes from portal.config (DATABASE_URL); see alembic/env.py

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
